    <text x="82" y="78">%tir.load tile[tx, ty]</text>
    <text x="82" y="108">for i, j in block:</text>
    <text x="82" y="138">  schedule.split</text>
    <text x="82" y="168">  vectorize lanes</text>
    <text x="82" y="198">  bind threadIdx.x</text>
  </g>

