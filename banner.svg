    <path d="M612 44V316" stroke="#7dd3fc"/>
    <path d="M772 44V316" stroke="#7dd3fc"/>
    <path d="M932 44V316" stroke="#7dd3fc"/>
    <path d="M1092 44V316" stroke="#7dd3fc"/>
