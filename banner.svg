    <text x="933" y="102" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#ccfbf1">PASS</text>
    <text x="1051" y="102" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#ddd6fe">GPU</text>
